      - name: blobHash
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
      summary: Get blob
      x-summary-source: derived
    put:
      tags:
      - Graph Chain APIs
      description: 'Allowed user roles:


        sdzUser


        Replace a specific blob on an SDO by its ID, attribute, and hash of the blob to replace'
      operationId: putBlob
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
      - name: sdoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attribute
        in: path
        required: true
        schema:
          type: string
      - name: blobHash
        in: path
        required: true
        schema:
          type: string
      - name: metadata
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDOBlob_Public'
      summary: Put blob
      x-summary-source: derived
    delete:
      tags:
      - Graph Chain APIs
      description: 'Allowed user roles:


        sdzUser


        deletes a blob(s) from an SDO by attribute name and blob hash'
