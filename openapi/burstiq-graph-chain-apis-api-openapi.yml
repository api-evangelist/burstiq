      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
      - name: sdoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attribute
        in: path
        required: true
        schema:
          type: string
      - name: metadata
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDOBlob_Public'
      summary: Put upsert blob
      x-summary-source: derived
    post:
      tags:
      - Graph Chain APIs
      description: 'Allowed user roles:


        sdzUser


        adds a blob to an SDO by ID and its attribute'
      operationId: postBlob
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
      - name: sdoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attribute
        in: path
        required: true
        schema:
          type: string
      - name: metadata
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDOBlob_Public'
      summary: Post blob
      x-summary-source: derived
    delete:
      tags:
      - Graph Chain APIs
      description: 'Allowed user roles:


        sdzUser


        deletes a blob(s) from an SDO by attribute name'
      operationId: deleteBlob
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
      - name: sdoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attribute
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
      summary: Delete blob
      x-summary-source: derived
  /api/graphchain/{chain}/{sdoId}/{attribute}/blobs/{blobHash}:
    get:
      tags:
      - Graph Chain APIs
      description: 'Allowed user roles:


        sdzReadOnly


        sdzUser


        get blob data for an SDO specifically for an attribute and its hash'
