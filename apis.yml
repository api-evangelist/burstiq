aid: burstiq
name: BurstIQ
description: >-
  BurstIQ is a health-and-data technology company whose LifeGraph platform pairs a
  blockchain-secured knowledge graph (GraphChain) with granular consent-and-ownership
  wallets and configurable data pipelines to give enterprises trusted, agent-ready
  data. The LifeGraph REST API (OpenAPI 3.1, version 2.42.0) exposes 171 operations
  across GraphChain Smart Data Objects, user and system wallets, dictionaries,
  glossaries, edge definitions, data pipelines, job management, and an OData v4
  query surface, secured with bearer (JWT) authentication. BurstIQ was surfaced as a
  500 Global portfolio company and enriched into the API Evangelist network.
