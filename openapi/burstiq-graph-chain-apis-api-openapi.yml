          type: string
          format: uuid
      - name: attribute
        in: path
        required: true
        schema:
          type: string
      - name: blobHash
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete blob by hash
      x-summary-source: derived
