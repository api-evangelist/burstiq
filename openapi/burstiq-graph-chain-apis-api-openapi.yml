        in: path
        required: true
        schema:
          type: string
      - name: sdoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      summary: Delete SDO
      x-summary-source: derived
  /api/graphchain/{chain}/{sdoId}/{attribute}/blobs:
    put:
      tags:
      - Graph Chain APIs
      description: 'Allowed user roles:


        sdzUser


        Upsert a blob, only works with scalar'
